<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESPEKT - Digitaler Erste-Hilfe-Kasten gegen Cybermobbing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans selection:bg-teal-400 selection:text-slate-900 min-h-screen flex flex-col justify-between">
    <!-- Root element for React app -->
    <div id="root"></div>

    <!-- React Application Script -->
    <script type="text/babel">
        const { 
            useState, 
            useEffect 
        } = React;

        // Custom icon wrappers using Lucide
        function Icon({ name, className = "w-5 h-5", ...props }) {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });
            return <i data-lucide={name} className={className} {...props}></i>;
        }

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab]);

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <Header activeTab={activeTab} setActiveTab={setActiveTab} mobileMenuOpen={mobileMenuOpen} setMobileMenuOpen={setMobileMenuOpen} />
                    <main className="flex-grow">
                        {activeTab === 'home' && <HomeSection setActiveTab={setActiveTab} />}
                        {activeTab === 'what-to-do' && <WhatToDoSection />}
                        {activeTab === 'scenarios' && <ScenariosSection />}
                        {activeTab === 'chat-simulator' && <ChatSimulatorSection />}
                        {activeTab === 'check' && <CybermobbingCheckSection />}
                        {activeTab === 'first-step' && <FirstStepSection setActiveTab={setActiveTab} />}
                        {activeTab === 'help' && <HelpSection />}
                        {activeTab === 'project' && <ProjectSection />}
                        {activeTab === 'qr-code' && <QrCodeSection />}
                        {activeTab === 'challenge' && <ChallengeSection />}
                    </main>
                    <Footer setActiveTab={setActiveTab} />
                </div>
            );
        }

        function Header({ activeTab, setActiveTab, mobileMenuOpen, setMobileMenuOpen }) {
            const navItems = [
                { id: 'home', label: 'Startseite' },
                { id: 'what-to-do', label: 'Was tun?' },
                { id: 'scenarios', label: 'Situationen' },
                { id: 'chat-simulator', label: 'Klassenchat' },
                { id: 'check', label: 'Cybermobbing-Check' },
                { id: 'first-step', label: 'Erster Schritt' },
                { id: 'help', label: 'Hilfe' },
                { id: 'project', label: 'Über das Projekt' },
                { id: 'qr-code', label: 'QR-Code' },
                { id: 'challenge', label: 'Challenge' },
            ];

            return (
                <header className="sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-800 text-white shadow-md">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex items-center justify-between h-20">
                            <div onClick={() => setActiveTab('home')} className="flex items-center space-x-3 cursor-pointer group">
                                <div className="w-11 h-11 rounded-xl bg-gradient-to-tr from-teal-400 to-blue-600 flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform text-slate-950 font-bold">
                                    <Icon name="shield-alert" className="w-6 h-6" />
                                </div>
                                <div>
                                    <span className="text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-teal-300">
                                        RESPEKT
                                    </span>
                                    <p className="text-xs text-teal-400 font-medium tracking-wide">Digitaler Erste-Hilfe-Kasten</p>
                                </div>
                            </div>

                            <nav className="hidden xl:flex items-center space-x-1">
                                {navItems.map((item) => (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveTab(item.id)}
                                        className={`px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                                            activeTab === item.id
                                                ? 'bg-teal-500 text-slate-950 font-semibold shadow-md'
                                                : 'text-slate-300 hover:text-white hover:bg-slate-800'
                                        }`}
                                    >
                                        {item.label}
                                    </button>
                                ))}
                            </nav>

                            <div className="xl:hidden flex items-center">
                                <button
                                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                                    className="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white focus:outline-none focus:ring-2 focus:ring-teal-400"
                                    aria-label="Menü öffnen"
                                >
                                    <Icon name={mobileMenuOpen ? "x" : "menu"} className="w-6 h-6" />
                                </button>
                            </div>
                        </div>
                    </div>

                    {mobileMenuOpen && (
                        <div className="xl:hidden bg-slate-900 border-b border-slate-800 px-4 pt-2 pb-4 space-y-1">
                            {navItems.map((item) => (
                                <button
                                    key={item.id}
                                    onClick={() => {
                                        setActiveTab(item.id);
                                        setMobileMenuOpen(false);
                                    }}
                                    className={`w-full text-left px-4 py-3 rounded-lg text-base font-medium transition-colors ${
                                        activeTab === item.id
                                            ? 'bg-teal-500 text-slate-950 font-semibold'
                                            : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                                    }`}
                                >
                                    {item.label}
                                </button>
                            ))}
                        </div>
                    )}
                </header>
            );
        }

        function HomeSection({ setActiveTab }) {
            return (
                <div className="space-y-16 pb-20">
                    <section className="relative overflow-hidden bg-gradient-to-b from-slate-900 via-blue-950 to-slate-900 text-white py-20 px-4 sm:px-6 lg:px-8 border-b border-slate-800">
                        <div className="absolute inset-0 opacity-10 bg-[radial-gradient(#2dd4bf_1px,transparent_1px)] [background-size:16px_16px]"></div>
                        <div className="max-w-5xl mx-auto text-center relative z-10 space-y-6">
                            <div className="inline-flex items-center space-x-2 bg-teal-500/10 border border-teal-400/30 px-4 py-1.5 rounded-full text-teal-300 text-sm font-semibold tracking-wide">
                                <Icon name="sparkles" className="w-4 h-4" />
                                <span>Schulprojekt „Stark gegen Cybermobbing“</span>
                            </div>
                            <h1 className="text-4xl sm:text-6xl font-black tracking-tight leading-tight">
                                Cybermobbing?<br />
                                <span className="bg-clip-text text-transparent bg-gradient-to-r from-teal-400 to-blue-400">
                                    Du musst damit nicht alleine bleiben.
                                </span>
                            </h1>
                            <p className="text-lg sm:text-xl text-slate-300 max-w-3xl mx-auto font-normal leading-relaxed">
                                Finde heraus, was du tun kannst – egal ob du selbst betroffen bist, jemandem helfen möchtest oder Cybermobbing beobachtet hast.
                            </p>
                            <div className="pt-4 flex flex-wrap justify-center gap-4">
                                <button
                                    onClick={() => setActiveTab('first-step')}
                                    className="bg-teal-400 hover:bg-teal-300 text-slate-950 font-bold px-8 py-4 rounded-xl shadow-lg transition-all flex items-center space-x-2 text-base"
                                >
                                    <span>Ich brauche jetzt Hilfe</span>
                                    <Icon name="arrow-right" className="w-5 h-5" />
                                </button>
                                <button
                                    onClick={() => setActiveTab('what-to-do')}
                                    className="bg-slate-800 hover:bg-slate-700 text-white font-semibold px-8 py-4 rounded-xl border border-slate-700 transition-all text-base"
                                >
                                    Was tun?
                                </button>
                            </div>
                        </div>
                    </section>

                    <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="bg-gradient-to-r from-blue-900 to-slate-900 text-white p-6 sm:p-8 rounded-2xl shadow-xl border border-blue-800 flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
                            <div>
                                <h3 className="text-lg font-bold text-teal-400 tracking-wider uppercase mb-1">Unser Leitgedanke</h3>
                                <p className="text-xl sm:text-2xl font-black tracking-wide text-white">
                                    NICHT MITMACHEN. NICHT WEGSCHAUEN. RESPEKT ZEIGEN.
                                </p>
                            </div>
                            <button
                                onClick={() => setActiveTab('project')}
                                className="whitespace-nowrap bg-white/10 hover:bg-white/20 text-white font-medium px-5 py-3 rounded-xl border border-white/20 transition-all text-sm"
                            >
                                Mehr über das Projekt
                            </button>
                        </div>
                    </div>

                    <section className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center mb-10">
                            <h2 className="text-2xl sm:text-3xl font-bold text-slate-900">In welcher Situation befindest du dich?</h2>
                            <p className="text-slate-600 mt-2">Wähle den Bereich, der am besten zu deiner Situation passt:</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-white rounded-2xl p-6 sm:p-8 shadow-md border border-slate-200 hover:border-red-300 transition-all flex flex-col justify-between group">
                                <div>
                                    <div className="w-12 h-12 rounded-xl bg-red-50 text-red-500 flex items-center justify-center font-bold text-xl mb-4 group-hover:scale-110 transition-transform">
                                        <Icon name="shield-alert" className="w-6 h-6" />
                                    </div>
                                    <span className="inline-block bg-red-100 text-red-700 text-xs font-bold px-3 py-1 rounded-full mb-3">Betroffen</span>
                                    <h3 className="text-xl font-bold text-slate-900 mb-2">Ich werde gemobbt</h3>
                                    <p className="text-slate-600 text-sm leading-relaxed mb-6">
                                        Du bist selbst betroffen und weißt nicht, was du tun kannst? Hol dir hier konkrete Erste-Hilfe-Schritte.
                                    </p>
                                </div>
                                <button
                                    onClick={() => setActiveTab('what-to-do')}
                                    className="w-full bg-slate-900 hover:bg-teal-500 hover:text-slate-950 text-white font-semibold py-3 px-4 rounded-xl transition-all flex items-center justify-center space-x-2 text-sm"
                                >
                                    <span>Was kann ich tun?</span>
                                    <Icon name="chevron-right" className="w-4 h-4" />
                                </button>
                            </div>

                            <div className="bg-white rounded-2xl p-6 sm:p-8 shadow-md border border-slate-200 hover:border-orange-300 transition-all flex flex-col justify-between group">
                                <div>
                                    <div className="w-12 h-12 rounded-xl bg-orange-50 text-orange-500 flex items-center justify-center font-bold text-xl mb-4 group-hover:scale-110 transition-transform">
                                        <Icon name="users" className="w-6 h-6" />
                                    </div>
                                    <span className="inline-block bg-orange-100 text-orange-700 text-xs font-bold px-3 py-1 rounded-full mb-3">Mitschüler helfen</span>
                                    <h3 className="text-xl font-bold text-slate-900 mb-2">Jemand aus meiner Klasse wird gemobbt</h3>
                                    <p className="text-slate-600 text-sm leading-relaxed mb-6">
                                        Du möchtest helfen, weißt aber nicht wie? Erfahre, wie du richtig unterstützt, ohne dich selbst in Gefahr zu bringen.
                                    </p>
                                </div>
                                <button
                                    onClick={() => setActiveTab('what-to-do')}
                                    className="w-full bg-slate-900 hover:bg-teal-500 hover:text-slate-950 text-white font-semibold py-3 px-4 rounded-xl transition-all flex items-center justify-center space-x-2 text-sm"
                                >
                                    <span>Wie kann ich helfen?</span>
                                    <Icon name="chevron-right" className="w-4 h-4" />
                                </button>
                            </div>

                            <div className="bg-white rounded-2xl p-6 sm:p-8 shadow-md border border-slate-200 hover:border-amber-300 transition-all flex flex-col justify-between group">
                                <div>
                                    <div className="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold text-xl mb-4 group-hover:scale-110 transition-transform">
                                        <Icon name="eye" className="w-6 h-6" />
                                    </div>
                                    <span className="inline-block bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full mb-3">Beobachtet</span>
                                    <h3 className="text-xl font-bold text-slate-900 mb-2">Ich habe Cybermobbing beobachtet</h3>
                                    <p className="text-slate-600 text-sm leading-relaxed mb-6">
                                        Du hast etwas gesehen oder in einem Chat mitbekommen? Sieh dir an, warum wegschauen das Problem vergrößert.
                                    </p>
                                </div>
                                <button
                                    onClick={() => setActiveTab('what-to-do')}
                                    className="w-full bg-slate-900 hover:bg-teal-500 hover:text-slate-950 text-white font-semibold py-3 px-4 rounded-xl transition-all flex items-center justify-center space-x-2 text-sm"
                                >
                                    <span>Was soll ich tun?</span>
                                    <Icon name="chevron-right" className="w-4 h-4" />
                                </button>
                            </div>

                            <div className="bg-white rounded-2xl p-6 sm:p-8 shadow-md border border-slate-200 hover:border-emerald-300 transition-all flex flex-col justify-between group">
                                <div>
                                    <div className="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-xl mb-4 group-hover:scale-110 transition-transform">
                                        <Icon name="message-square-warning" className="w-6 h-6" />
                                    </div>
                                    <span className="inline-block bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full mb-3">Reflektieren</span>
                                    <h3 className="text-xl font-bold text-slate-900 mb-2">Ich habe selbst etwas Verletzendes geschrieben</h3>
                                    <p className="text-slate-600 text-sm leading-relaxed mb-6">
                                        Du hast etwas getan und möchtest die Situation verbessern? Verantwortung übernehmen ist ein starker Schritt.
                                    </p>
                                </div>
                                <button
                                    onClick={() => setActiveTab('what-to-do')}
                                    className="w-full bg-slate-900 hover:bg-teal-500 hover:text-slate-950 text-white font-semibold py-3 px-4 rounded-xl transition-all flex items-center justify-center space-x-2 text-sm"
                                >
                                    <span>Was jetzt?</span>
                                    <Icon name="chevron-right" className="w-4 h-4" />
                                </button>
                            </div>
                        </div>
                    </section>
                </div>
            );
        }

        function WhatToDoSection() {
            const [activeCategory, setActiveCategory] = useState('self');

            return (
                <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-10">
                    <div className="text-center max-w-3xl mx-auto space-y-4">
                        <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900">Was tun bei Cybermobbing?</h1>
                        <p className="text-slate-600 text-base sm:text-lg">
                            Hier findest du praktische, klare Handlungsschritte für jede Rolle in einer Konfliktsituation.
                        </p>

                        <div className="flex flex-wrap justify-center gap-2 pt-4">
                            <button
                                onClick={() => setActiveCategory('self')}
                                className={`px-5 py-3 rounded-xl font-semibold text-sm transition-all ${
                                    activeCategory === 'self' ? 'bg-slate-900 text-white shadow-lg' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'
                                }`}
                            >
                                Wenn du selbst betroffen bist
                            </button>
                            <button
                                onClick={() => setActiveCategory('other')}
                                className={`px-5 py-3 rounded-xl font-semibold text-sm transition-all ${
                                    activeCategory === 'other' ? 'bg-slate-900 text-white shadow-lg' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'
                                }`}
                            >
                                Wenn jemand anderes betroffen ist
                            </button>
                            <button
                                onClick={() => setActiveCategory('witness')}
                                className={`px-5 py-3 rounded-xl font-semibold text-sm transition-all ${
                                    activeCategory === 'witness' ? 'bg-slate-900 text-white shadow-lg' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'
                                }`}
                            >
                                Wenn du Cybermobbing beobachtest
                            </button>
                            <button
                                onClick={() => setActiveCategory('author')}
                                className={`px-5 py-3 rounded-xl font-semibold text-sm transition-all ${
                                    activeCategory === 'author' ? 'bg-slate-900 text-white shadow-lg' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'
                                }`}
                            >
                                Wenn du selbst etwas geschrieben hast
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-3xl p-6 sm:p-10 shadow-xl border border-slate-200">
                        {activeCategory === 'self' && (
                            <div className="space-y-8">
                                <div className="border-b border-slate-100 pb-6">
                                    <span className="text-red-600 font-bold text-sm tracking-wide uppercase">Erste Hilfe für Betroffene</span>
                                    <h2 className="text-2xl font-bold text-slate-900 mt-1">Du wirst gemobbt? Das kannst du jetzt tun:</h2>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-3">
                                        <div className="w-10 h-10 bg-red-100 text-red-600 rounded-xl flex items-center justify-center font-bold text-lg">1</div>
                                        <h3 className="font-bold text-slate-900 text-lg">Bleib nicht allein</h3>
                                        <p className="text-slate-600 text-sm leading-relaxed">Sprich mit einer Person, der du vertraust – sei es in der Familie, im Freundeskreis oder in der Schule.</p>
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-3">
                                        <div className="w-10 h-10 bg-red-100 text-red-600 rounded-xl flex items-center justify-center font-bold text-lg">2</div>
                                        <h3 className="font-bold text-slate-900 text-lg">Sichere Beweise</h3>
                                        <p className="text-slate-600 text-sm leading-relaxed">Screenshots und Nachrichten können später wichtig sein. Lösche nichts voreilig.</p>
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-3">
                                        <div className="w-10 h-10 bg-red-100 text-red-600 rounded-xl flex items-center justify-center font-bold text-lg">3</div>
                                        <h3 className="font-bold text-slate-900 text-lg">Nicht zurückmobben</h3>
                                        <p className="text-slate-600 text-sm leading-relaxed">Versuche nicht, die Situation durch weitere Beleidigungen zu verschärfen.</p>
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-3">
                                        <div className="w-10 h-10 bg-red-100 text-red-600 rounded-xl flex items-center justify-center font-bold text-lg">4</div>
                                        <h3 className="font-bold text-slate-900 text-lg">Hilfe holen</h3>
                                        <p className="text-slate-600 text-sm leading-relaxed">Wende dich an Eltern, Lehrkräfte, Schulsozialarbeit oder andere Vertrauenspersonen.</p>
                                    </div>
                                    <div className="bg-red-50 p-6 rounded-2xl border border-red-200 space-y-3 md:col-span-2 lg:col-span-2">
                                        <div className="w-10 h-10 bg-red-500 text-white rounded-xl flex items-center justify-center font-bold text-lg">5</div>
                                        <h3 className="font-bold text-red-950 text-lg">Bei akuter Gefahr</h3>
                                        <p className="text-red-900 text-sm leading-relaxed">Hole sofort Unterstützung von einer erwachsenen Vertrauensperson bzw. den Notfallstellen (z.B. Nummer gegen Kummer 116111).</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeCategory === 'other' && (
                            <div className="space-y-8">
                                <div className="border-b border-slate-100 pb-6">
                                    <span className="text-orange-600 font-bold text-sm tracking-wide uppercase">Zivilcourage zeigen</span>
                                    <h2 className="text-2xl font-bold text-slate-900 mt-1">Jemand anderes ist betroffen:</h2>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-3">
                                        <div className="w-10 h-10 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center font-bold text-lg">✓</div>
                                        <h3 className="font-bold text-slate-900 text-lg">Ernst nehmen</h3>
                                        <p className="text-slate-600 text-sm leading-relaxed">Nimm die Sorgen der betroffenen Person ernst und spiele nichts herunter.</p>
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-3">
                                        <div className="w-10 h-10 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center font-bold text-lg">✓</div>
                                        <h3 className="font-bold text-slate-900 text-lg">Zuhören</h3>
                                        <p className="text-slate-600 text-sm leading-relaxed">Hör genau zu und gib der Person das Gefühl, nicht allein zu sein.</p>
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-3">
                                        <div className="w-10 h-10 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center font-bold text-lg">✓</div>
                                        <h3 className="font-bold text-slate-900 text-lg">Nicht mitmachen</h3>
                                        <p className="text-slate-600 text-sm leading-relaxed">Lache nicht mit und teile verletzende Inhalte unter keinen Umständen.</p>
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-3">
                                        <div className="w-10 h-10 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center font-bold text-lg">✓</div>
                                        <h3 className="font-bold text-slate-900 text-lg">Nicht weiterleiten</h3>
                                        <p className="text-slate-600 text-sm leading-relaxed">Stoppe die Verbreitung von Gerüchten, Fotos oder Screenshots.</p>
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-3">
                                        <div className="w-10 h-10 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center font-bold text-lg">✓</div>
                                        <h3 className="font-bold text-slate-900 text-lg">Gemeinsam Hilfe holen</h3>
                                        <p className="text-slate-600 text-sm leading-relaxed">Biete an, gemeinsam zu einer Lehrkraft oder Schulsozialarbeit zu gehen.</p>
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-3">

                    <div className="text-center space-y-4">

                        <p className="text-xl font-semibold text-teal-600">Wir wollen nicht nur über Cybermobbing sprechen. Wir wollen etwas verändern.</p>
                    </div>
                    <div className="bg-white rounded-3xl p-8 sm:p-10 shadow-xl border border-slate-200 space-y-8">
                        <p className="text-slate-700 leading-relaxed">
                            Diese Website wurde im Rahmen des Projekts „Stark gegen Cybermobbing“ entwickelt, um Schülerinnen und Schülern unkomplizierte Hilfe und Handlungsschritte an die Hand zu geben.
                        </p>
                    </div>
                </div>
            );
        }

        function QrCodeSection() {
    return (
        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-10">
            <div className="text-center space-y-4">
                <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900">
                    Scannen. Informieren. Helfen.
                </h1>
                <p className="text-slate-600">
                    Unser QR-Code für Plakate und Aushänge in der Schule.
                </p>
            </div>

            <div className="bg-white rounded-3xl p-8 sm:p-12 shadow-xl border border-slate-200 text-center space-y-6 max-w-md mx-auto">
                <img
                    src="/bilder/respekt.jpg"
                    alt="QR-Code für RESPEKT"
                    className="w-48 h-48 mx-auto rounded-2xl object-contain"
                />

                <p className="text-sm text-slate-600">
                    Diesen QR-Code verwenden wir in der Schule auf Plakaten.
                </p>
            </div>
        </div>
    );
}
        function ChallengeSection() {
            const [completedDays, setCompletedDays] = useState(() => {
                try {
                    const saved = localStorage.getItem('respekt_challenge');
                    return saved ? JSON.parse(saved) : {};
                } catch {
                    return {};
                }
            });

            const challengeDays = [
                { day: 1, text: "Sag jemandem ehrlich Danke." },
                { day: 2, text: "Schließe niemanden absichtlich aus." },
                { day: 3, text: "Schreibe einen positiven Kommentar." },
                { day: 4, text: "Unterstütze jemanden, der alleine ist." },
                { day: 5, text: "Greife ein, wenn jemand unfair behandelt wird." },
                { day: 6, text: "Denke nach, bevor du etwas weiterleitest." },
                { day: 7, text: "Tu heute etwas Nettes für jemanden." },
            ];

            const toggleDay = (dayNum) => {
                const updated = { ...completedDays, [dayNum]: !completedDays[dayNum] };
                setCompletedDays(updated);
                try {
                    localStorage.setItem('respekt_challenge', JSON.stringify(updated));
                } catch (e) {}
            };

            return (
                <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-10">
                    <div className="text-center space-y-4">
                        <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900">Kleine Respekt-Challenge</h1>
                        <p className="text-slate-600">7 Tage – 7 Aktionen für mehr Respekt. Klicke auf die Tage, um sie zu markieren!</p>
                    </div>

                    <div className="space-y-4">
                        {challengeDays.map((item) => {
                            const isDone = !!completedDays[item.day];
                            return (
                                <div
                                    key={item.day}
                                    onClick={() => toggleDay(item.day)}
                                    className={`p-6 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${
                                        isDone ? 'bg-teal-50 border-teal-300 text-slate-900' : 'bg-white border-slate-200 text-slate-700'
                                    }`}
                                >
                                    <div className="flex items-center space-x-4">
                                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-bold text-sm ${isDone ? 'bg-teal-500 text-slate-950' : 'bg-slate-100 text-slate-700'}`}>
                                            Tag {item.day}
                                        </div>
                                        <span className={`font-semibold text-base ${isDone ? 'line-through text-slate-500' : 'text-slate-900'}`}>
                                            {item.text}
                                        </span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function Footer({ setActiveTab }) {
            return (
                <footer className="bg-slate-900 text-white border-t border-slate-800 py-12 px-4 sm:px-6 lg:px-8 mt-20">
                    <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8 pb-8 border-b border-slate-800">
                        <div className="space-y-3 md:col-span-2">
                            <div className="flex items-center space-x-3">
                                <span className="text-xl font-black">RESPEKT</span>
                            </div>
                            <p className="text-slate-400 text-sm max-w-md">Dein digitaler Erste-Hilfe-Kasten gegen Cybermobbing.</p>
                        </div>
                    </div>
                    <div className="max-w-7xl mx-auto pt-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-400">
                        <p>© 2026 Projekt RESPEKT.</p>
                        <p className="mt-2 sm:mt-0 font-semibold text-teal-300">NICHT MITMACHEN. NICHT WEGSCHAUEN. RESPEKT ZEIGEN.</p>
                    </div>
                </footer>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
