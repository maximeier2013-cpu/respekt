<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RESPEKT - Digitaler Erste-Hilfe-Kasten gegen Cybermobbing</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans selection:bg-teal-400 selection:text-slate-900 min-h-screen">

<div id="root"></div>

<script type="text/babel">

const {
    useState,
    useEffect
} = React;


/* =========================
   ICON
========================= */

function Icon({ name, className = "w-5 h-5", ...props }) {

    useEffect(() => {

        if (window.lucide) {
            window.lucide.createIcons();
        }

    });

    return (
        <i
            data-lucide={name}
            className={className}
            {...props}
        ></i>
    );
}


/* =========================
   APP
========================= */

function App() {

    const [activeTab, setActiveTab] = useState("home");
    const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

    useEffect(() => {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        if (window.lucide) {
            window.lucide.createIcons();
        }

    }, [activeTab]);


    return (

        <div className="min-h-screen flex flex-col">

            <Header
                activeTab={activeTab}
                setActiveTab={setActiveTab}
                mobileMenuOpen={mobileMenuOpen}
                setMobileMenuOpen={setMobileMenuOpen}
            />


            <main className="flex-grow">

                {activeTab === "home" && (
                    <HomeSection setActiveTab={setActiveTab} />
                )}

                {activeTab === "what-to-do" && (
                    <WhatToDoSection />
                )}

                {activeTab === "scenarios" && (
                    <ScenariosSection />
                )}

                {activeTab === "chat-simulator" && (
                    <ChatSimulatorSection />
                )}

                {activeTab === "check" && (
                    <CybermobbingCheckSection />
                )}

                {activeTab === "first-step" && (
                    <FirstStepSection />
                )}

                {activeTab === "help" && (
                    <HelpSection />
                )}

                {activeTab === "project" && (
                    <ProjectSection />
                )}

                {activeTab === "qr-code" && (
                    <QrCodeSection />
                )}

                {activeTab === "challenge" && (
                    <ChallengeSection />
                )}

            </main>


            <Footer />

        </div>
    );
}


/* =========================
   HEADER
========================= */

function Header({
    activeTab,
    setActiveTab,
    mobileMenuOpen,
    setMobileMenuOpen
}) {

    const navItems = [

        {
            id: "home",
            label: "Startseite"
        },

        {
            id: "what-to-do",
            label: "Was tun?"
        },

        {
            id: "scenarios",
            label: "Situationen"
        },

        {
            id: "chat-simulator",
            label: "Klassenchat"
        },

        {
            id: "check",
            label: "Cybermobbing-Check"
        },

        {
            id: "first-step",
            label: "Erster Schritt"
        },

        {
            id: "help",
            label: "Hilfe"
        },

        {
            id: "project",
            label: "Über das Projekt"
        },

        {
            id: "qr-code",
            label: "QR-Code"
        },

        {
            id: "challenge",
            label: "Challenge"
        }

    ];


    return (

        <header className="sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-800 text-white shadow-md">

            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                <div className="flex items-center justify-between h-20">


                    <div
                        onClick={() => setActiveTab("home")}
                        className="flex items-center space-x-3 cursor-pointer group"
                    >

                        <div className="w-11 h-11 rounded-xl bg-gradient-to-tr from-teal-400 to-blue-600 flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform text-slate-950">

                            <Icon
                                name="shield-alert"
                                className="w-6 h-6"
                            />

                        </div>


                        <div>

                            <span className="text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-teal-300">
                                RESPEKT
                            </span>

                            <p className="text-xs text-teal-400 font-medium tracking-wide">
                                Digitaler Erste-Hilfe-Kasten
                            </p>

                        </div>

                    </div>


                    <nav className="hidden xl:flex items-center space-x-1">

                        {navItems.map((item) => (

                            <button
                                key={item.id}
                                onClick={() => setActiveTab(item.id)}
                                className={`px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                                    activeTab === item.id
                                        ? "bg-teal-500 text-slate-950 font-semibold shadow-md"
                                        : "text-slate-300 hover:text-white hover:bg-slate-800"
                                }`}
                            >

                                {item.label}

                            </button>

                        ))}

                    </nav>


                    <div className="xl:hidden">

                        <button
                            onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                            className="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white"
                        >

                            <Icon
                                name={mobileMenuOpen ? "x" : "menu"}
                                className="w-6 h-6"
                            />

                        </button>

                    </div>

                </div>

            </div>


            {mobileMenuOpen && (

                <div className="xl:hidden bg-slate-900 border-b border-slate-800 px-4 pb-4 space-y-1">

                    {navItems.map((item) => (

                        <button
                            key={item.id}
                            onClick={() => {
                                setActiveTab(item.id);
                                setMobileMenuOpen(false);
                            }}
                            className={`w-full text-left px-4 py-3 rounded-lg text-base font-medium ${
                                activeTab === item.id
                                    ? "bg-teal-500 text-slate-950"
                                    : "text-slate-300 hover:bg-slate-800 hover:text-white"
                            }`}
                        >

                            {item.label}

                        </button>

                    ))}

                </div>

            )}

        </header>
    );
}


/* =========================
   HOME
========================= */

function HomeSection({ setActiveTab }) {

    return (

        <div className="space-y-16 pb-20">


            <section className="relative overflow-hidden bg-gradient-to-b from-slate-900 via-blue-950 to-slate-900 text-white py-20 px-4 border-b border-slate-800">

                <div className="absolute inset-0 opacity-10 bg-[radial-gradient(#2dd4bf_1px,transparent_1px)] [background-size:16px_16px]"></div>


                <div className="max-w-5xl mx-auto text-center relative z-10 space-y-6">

                    <div className="inline-flex items-center space-x-2 bg-teal-500/10 border border-teal-400/30 px-4 py-1.5 rounded-full text-teal-300 text-sm font-semibold">

                        <Icon
                            name="sparkles"
                            className="w-4 h-4"
                        />

                        <span>
                            Schulprojekt „Stark gegen Cybermobbing“
                        </span>

                    </div>


                    <h1 className="text-4xl sm:text-6xl font-black tracking-tight leading-tight">

                        Cybermobbing?<br />

                        <span className="bg-clip-text text-transparent bg-gradient-to-r from-teal-400 to-blue-400">
                            Du musst damit nicht alleine bleiben.
                        </span>

                    </h1>


                    <p className="text-lg sm:text-xl text-slate-300 max-w-3xl mx-auto leading-relaxed">

                        Finde heraus, was du tun kannst – egal ob du selbst betroffen bist,
                        jemandem helfen möchtest oder Cybermobbing beobachtet hast.

                    </p>


                    <div className="pt-4 flex flex-wrap justify-center gap-4">

                        <button
                            onClick={() => setActiveTab("first-step")}
                            className="bg-teal-400 hover:bg-teal-300 text-slate-950 font-bold px-8 py-4 rounded-xl shadow-lg transition-all flex items-center space-x-2"
                        >

                            <span>
                                Ich brauche jetzt Hilfe
                            </span>

                            <Icon
                                name="arrow-right"
                                className="w-5 h-5"
                            />

                        </button>


                        <button
                            onClick={() => setActiveTab("what-to-do")}
                            className="bg-slate-800 hover:bg-slate-700 text-white font-semibold px-8 py-4 rounded-xl border border-slate-700"
                        >
                            Was tun?
                        </button>

                    </div>

                </div>

            </section>


            <section className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">

                <div className="bg-gradient-to-r from-blue-900 to-slate-900 text-white p-6 sm:p-8 rounded-2xl shadow-xl border border-blue-800 flex flex-col md:flex-row items-center justify-between gap-6">

                    <div>

                        <h3 className="text-lg font-bold text-teal-400 uppercase mb-1">
                            Unser Leitgedanke
                        </h3>

                        <p className="text-xl sm:text-2xl font-black">
                            NICHT MITMACHEN. NICHT WEGSCHAUEN. RESPEKT ZEIGEN.
                        </p>

                    </div>


                    <button
                        onClick={() => setActiveTab("project")}
                        className="bg-white/10 hover:bg-white/20 px-5 py-3 rounded-xl border border-white/20"
                    >
                        Mehr über das Projekt
                    </button>

                </div>

            </section>


            <section className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">

                <div className="text-center mb-10">

                    <h2 className="text-2xl sm:text-3xl font-bold text-slate-900">
                        In welcher Situation befindest du dich?
                    </h2>

                    <p className="text-slate-600 mt-2">
                        Wähle den Bereich, der am besten zu deiner Situation passt.
                    </p>

                </div>


                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">


                    <SituationCard
                        icon="shield-alert"
                        color="red"
                        title="Ich werde gemobbt"
                        badge="Betroffen"
                        text="Du bist selbst betroffen und weißt nicht, was du tun kannst?"
                        button="Was kann ich tun?"
                        onClick={() => setActiveTab("what-to-do")}
                    />


                    <SituationCard
                        icon="users"
                        color="orange"
                        title="Jemand aus meiner Klasse wird gemobbt"
                        badge="Mitschüler helfen"
                        text="Du möchtest helfen, weißt aber nicht wie?"
                        button="Wie kann ich helfen?"
                        onClick={() => setActiveTab("what-to-do")}
                    />


                    <SituationCard
                        icon="eye"
                        color="amber"
                        title="Ich habe Cybermobbing beobachtet"
                        badge="Beobachtet"
                        text="Du hast etwas gesehen oder in einem Chat mitbekommen?"
                        button="Was soll ich tun?"
                        onClick={() => setActiveTab("what-to-do")}
                    />


                    <SituationCard
                        icon="message-square-warning"
                        color="emerald"
                        title="Ich habe selbst etwas Verletzendes geschrieben"
                        badge="Reflektieren"
                        text="Du hast etwas getan und möchtest die Situation verbessern?"
                        button="Was jetzt?"
                        onClick={() => setActiveTab("what-to-do")}
                    />

                </div>

            </section>

        </div>
    );
}


/* =========================
   SITUATION CARD
========================= */

function SituationCard({
    icon,
    color,
    title,
    badge,
    text,
    button,
    onClick
}) {

    const colors = {

        red: "bg-red-50 text-red-500",
        orange: "bg-orange-50 text-orange-500",
        amber: "bg-amber-50 text-amber-600",
        emerald: "bg-emerald-50 text-emerald-600"

    };


    return (

        <div className="bg-white rounded-2xl p-6 sm:p-8 shadow-md border border-slate-200 flex flex-col justify-between">

            <div>

                <div className={`w-12 h-12 rounded-xl flex items-center justify-center mb-4 ${colors[color]}`}>

                    <Icon
                        name={icon}
                        className="w-6 h-6"
                    />

                </div>


                <span className="inline-block bg-slate-100 text-slate-700 text-xs font-bold px-3 py-1 rounded-full mb-3">
                    {badge}
                </span>


                <h3 className="text-xl font-bold text-slate-900 mb-2">
                    {title}
                </h3>


                <p className="text-slate-600 text-sm leading-relaxed mb-6">
                    {text}
                </p>

            </div>


            <button
                onClick={onClick}
                className="w-full bg-slate-900 hover:bg-teal-500 hover:text-slate-950 text-white font-semibold py-3 px-4 rounded-xl transition-all flex items-center justify-center space-x-2"
            >

                <span>
                    {button}
                </span>

                <Icon
                    name="chevron-right"
                    className="w-4 h-4"
                />

            </button>

        </div>
    );
}


/* =========================
   WAS TUN?
========================= */

function WhatToDoSection() {

    const [activeCategory, setActiveCategory] = useState("self");


    return (

        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-10">

            <div className="text-center max-w-3xl mx-auto space-y-4">

                <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900">
                    Was tun bei Cybermobbing?
                </h1>

                <p className="text-slate-600">
                    Hier findest du praktische Handlungsschritte für verschiedene Situationen.
                </p>


                <div className="flex flex-wrap justify-center gap-2 pt-4">

                    {[
                        ["self", "Wenn du selbst betroffen bist"],
                        ["other", "Wenn jemand anderes betroffen ist"],
                        ["witness", "Wenn du Cybermobbing beobachtest"],
                        ["author", "Wenn du selbst etwas geschrieben hast"]
                    ].map(([id, label]) => (

                        <button
                            key={id}
                            onClick={() => setActiveCategory(id)}
                            className={`px-5 py-3 rounded-xl font-semibold text-sm ${
                                activeCategory === id
                                    ? "bg-slate-900 text-white"
                                    : "bg-white text-slate-700 border border-slate-200"
                            }`}
                        >
                            {label}
                        </button>

                    ))}

                </div>

            </div>


            <div className="bg-white rounded-3xl p-6 sm:p-10 shadow-xl border border-slate-200">


                {activeCategory === "self" && (

                    <div className="space-y-8">

                        <h2 className="text-2xl font-bold">
                            Du wirst gemobbt? Das kannst du jetzt tun:
                        </h2>


                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                            <StepCard
                                number="1"
                                title="Bleib nicht allein"
                                text="Sprich mit einer Person, der du vertraust."
                            />

                            <StepCard
                                number="2"
                                title="Sichere Beweise"
                                text="Screenshots und Nachrichten können später wichtig sein."
                            />

                            <StepCard
                                number="3"
                                title="Nicht zurückmobben"
                                text="Versuche nicht, die Situation durch weitere Beleidigungen zu verschärfen."
                            />

                            <StepCard
                                number="4"
                                title="Hilfe holen"
                                text="Wende dich an Eltern, Lehrkräfte oder Schulsozialarbeit."
                            />

                            <div className="bg-red-50 p-6 rounded-2xl border border-red-200 md:col-span-2">

                                <h3 className="font-bold text-red-900 text-lg mb-2">
                                    Bei akuter Gefahr
                                </h3>

                                <p className="text-red-900 text-sm">
                                    Hole sofort Unterstützung von einer erwachsenen Vertrauensperson.
                                </p>

                            </div>

                        </div>

                    </div>

                )}


                {activeCategory === "other" && (

                    <div className="space-y-8">

                        <h2 className="text-2xl font-bold">
                            Jemand anderes ist betroffen:
                        </h2>


                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                            <InfoCard
                                title="Ernst nehmen"
                                text="Nimm die Sorgen der betroffenen Person ernst."
                            />

                            <InfoCard
                                title="Zuhören"
                                text="Gib der Person das Gefühl, nicht allein zu sein."
                            />

                            <InfoCard
                                title="Nicht mitmachen"
                                text="Lache nicht mit und teile verletzende Inhalte nicht."
                            />

                            <InfoCard
                                title="Gemeinsam Hilfe holen"
                                text="Biete an, gemeinsam zu einer Vertrauensperson zu gehen."
                            />

                        </div>

                    </div>

                )}


                {activeCategory === "witness" && (

                    <div className="space-y-8">

                        <h2 className="text-2xl font-bold">
                            Du hast Cybermobbing beobachtet:
                        </h2>


                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                            <InfoCard
                                title="Im Klassenchat"
                                text="Schreibe sachlich und klar: „Das ist nicht okay. Lasst das sein.“"
                            />

                            <InfoCard
                                title="Auf Social Media"
                                text="Melde beleidigende Beiträge und unterstütze die betroffene Person."
                            />

                        </div>

                    </div>

                )}


                {activeCategory === "author" && (

                    <div className="space-y-8">

                        <h2 className="text-2xl font-bold">
                            Du hast selbst etwas Verletzendes geschrieben:
                        </h2>


                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

                            <StepCard
                                number="1"
                                title="Inhalte löschen"
                                text="Lösche den verletzenden Beitrag, soweit möglich."
                            />

                            <StepCard
                                number="2"
                                title="Entschuldigen"
                                text="Entschuldige dich ehrlich bei der betroffenen Person."
                            />

                            <StepCard
                                number="3"
                                title="Daraus lernen"
                                text="Überlege, wie du eine ähnliche Situation in Zukunft vermeiden kannst."
                            />

                        </div>

                    </div>

                )}

            </div>

        </div>
    );
}


/* =========================
   STEP CARD
========================= */

function StepCard({ number, title, text }) {

    return (

        <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200">

            <div className="w-10 h-10 bg-teal-100 text-teal-700 rounded-xl flex items-center justify-center font-bold mb-4">
                {number}
            </div>

            <h3 className="font-bold text-slate-900 text-lg mb-2">
                {title}
            </h3>

            <p className="text-slate-600 text-sm leading-relaxed">
                {text}
            </p>

        </div>
    );
}


/* =========================
   INFO CARD
========================= */

function InfoCard({ title, text }) {

    return (

        <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200">

            <h3 className="font-bold text-slate-900 text-lg mb-2">
                {title}
            </h3>

            <p className="text-slate-600 text-sm leading-relaxed">
                {text}
            </p>

        </div>
    );
}


/* =========================
   SITUATIONEN
========================= */

function ScenariosSection() {

    const scenarios = [

        {
            title: "Situation 1: Das peinliche Foto",
            text: "In eurem Klassenchat wird ein peinliches Bild einer Mitschülerin gepostet.",
            options: [
                "Ich lache mit.",
                "Ich leite das Bild weiter.",
                "Ich schreibe, dass das nicht okay ist und leite es nicht weiter.",
                "Ich ignoriere es komplett."
            ]
        },

        {
            title: "Situation 2: Beleidigung auf Social Media",
            text: "Unter dem Post eines Mitschülers stehen fiese Kommentare über sein Aussehen.",
            options: [
                "Ich like die fiesen Kommentare.",
                "Ich schreibe einen positiven Gegenkommentar und melde die Beleidigungen.",
                "Ich mache einen Screenshot und schicke ihn weiter."
            ]
        },

        {
            title: "Situation 3: Ausgrenzung",
            text: "Ein Mitschüler wird absichtlich aus einer gemeinsamen Projektgruppe ausgeschlossen.",
            options: [
                "Betrifft mich nicht.",
                "Ich frage den Mitschüler, ob er mit uns arbeiten möchte."
            ]
        },

        {
            title: "Situation 4: Online-Gerücht",
            text: "Über eine Schülerin wird ein falsches Gerücht verbreitet.",
            options: [
                "Ich frage sie privat, was passiert ist.",
                "Ich frage in der Gruppe nach weiteren Details."
            ]
        }

    ];


    const [answers, setAnswers] = useState({});


    return (

        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-10">

            <div className="text-center space-y-4">

                <h1 className="text-3xl sm:text-4xl font-extrabold">
                    Was würdest du tun?
                </h1>

                <p className="text-slate-600">
                    Teste verschiedene realistische Schulsituationen.
                </p>

            </div>


            {scenarios.map((scenario, index) => (

                <div
                    key={index}
                    className="bg-white rounded-2xl p-6 sm:p-8 shadow-md border border-slate-200 space-y-5"
                >

                    <h3 className="text-xl font-bold">
                        {scenario.title}
                    </h3>

                    <p className="bg-slate-50 p-4 rounded-xl text-sm">
                        {scenario.text}
                    </p>


                    <div className="space-y-2">

                        {scenario.options.map((option, optionIndex) => (

                            <button
                                key={optionIndex}
                                onClick={() =>
                                    setAnswers({
                                        ...answers,
                                        [index]: optionIndex
                                    })
                                }
                                className={`w-full text-left p-4 rounded-xl border text-sm ${
                                    answers[index] === optionIndex
                                        ? "bg-teal-50 border-teal-400"
                                        : "border-slate-200 hover:bg-slate-50"
                                }`}
                            >

                                {option}

                            </button>

                        ))}

                    </div>


                    {answers[index] !== undefined && (

                        <div className="bg-teal-50 border border-teal-200 rounded-xl p-4 text-sm">

                            <strong>
                                Tipp:
                            </strong>

                            <br />

                            Nicht mitmachen, nichts weiterverbreiten und die betroffene Person unterstützen.

                        </div>

                    )}

                </div>

            ))}

        </div>
    );
}


/* =========================
   CHAT SIMULATOR
========================= */

function ChatSimulatorSection() {

    const messages = [

        {
            sender: "Lena",
            text: "Hat jemand das Bild von Max gesehen?",
            time: "14:10"
        },

        {
            sender: "Ben",
            text: "HAHA 😂",
            time: "14:11"
        },

        {
            sender: "Tom",
            text: "Schick mal.",
            time: "14:11"
        },

        {
            sender: "Sarah",
            text: "Find ich nicht okay.",
            time: "14:12"
        }

    ];


    const reactions = [

        "Mitmachen",

        "Schweigen",

        "Situation stoppen",

        "Betroffene Person unterstützen",

        "Hilfe holen"

    ];


    const [selectedMessage, setSelectedMessage] = useState(null);
    const [reaction, setReaction] = useState(null);


    return (

        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-10">

            <div className="text-center space-y-4">

                <h1 className="text-3xl sm:text-4xl font-extrabold">
                    Fake-Klassenchat Simulator
                </h1>

                <p className="text-slate-600">
                    Klicke auf eine Nachricht und teste verschiedene Reaktionen.
                </p>

            </div>


            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">


                <div className="bg-slate-900 rounded-2xl p-6 shadow-xl">

                    <div className="text-white font-bold border-b border-slate-700 pb-3 mb-4">
                        💬 Klassengruppe
                    </div>


                    <div className="space-y-3">

                        {messages.map((message, index) => (

                            <button
                                key={index}
                                onClick={() => {
                                    setSelectedMessage(index);
                                    setReaction(null);
                                }}
                                className={`w-full text-left p-4 rounded-xl ${
                                    selectedMessage === index
                                        ? "bg-teal-500/20 border border-teal-400"
                                        : "bg-slate-800"
                                }`}
                            >

                                <div className="flex justify-between text-xs text-slate-400">

                                    <span className="text-teal-300 font-bold">
                                        {message.sender}
                                    </span>

                                    <span>
                                        {message.time}
                                    </span>

                                </div>

                                <p className="text-white text-sm mt-1">
                                    {message.text}
                                </p>

                            </button>

                        ))}

                    </div>

                </div>


                <div className="bg-white rounded-2xl p-6 shadow-md border border-slate-200">

                    <h3 className="text-xl font-bold mb-5">
                        Wie reagierst du?
                    </h3>


                    {selectedMessage === null ? (

                        <p className="text-slate-500 text-sm">
                            Wähle links eine Nachricht aus.
                        </p>

                    ) : (

                        <div className="space-y-3">

                            {reactions.map((item, index) => (

                                <button
                                    key={index}
                                    onClick={() => setReaction(item)}
                                    className={`w-full text-left p-3 rounded-xl border text-sm font-semibold ${
                                        reaction === item
                                            ? "bg-slate-900 text-white"
                                            : "border-slate-200 hover:bg-slate-50"
                                    }`}
                                >
                                    {item}
                                </button>

                            ))}


                            {reaction && (

                                <div className="mt-5 bg-teal-50 border border-teal-200 p-4 rounded-xl text-sm">

                                    <strong>
                                        Mögliche Auswirkung:
                                    </strong>

                                    <p className="mt-1">
                                        Deine Reaktion kann beeinflussen, ob die Situation eskaliert oder gestoppt wird.
                                    </p>

                                </div>

                            )}

                        </div>

                    )}

                </div>

            </div>

        </div>
    );
}


/* =========================
   CYBERMOBBING CHECK
========================= */

function CybermobbingCheckSection() {

    const questions = [

        "Passiert das wiederholt und über längere Zeit?",

        "Wird eine Person absichtlich verletzt, verspottet oder bloßgestellt?",

        "Werden Bilder, Videos oder Nachrichten ohne Zustimmung verbreitet?",

        "Wird jemand gezielt aus Chats oder digitalen Gruppen ausgeschlossen?",

        "Findet das Ganze online oder über digitale Medien statt?",

        "Fühlt sich die betroffene Person hilflos oder stark belastet?",

        "Führten frühere Bitten, damit aufzuhören, zu keinem Erfolg?"

    ];


    const [answers, setAnswers] = useState({});


    const completed =
        Object.keys(answers).length === questions.length;


    const yesCount =
        Object.values(answers).filter(
            answer => answer === "yes"
        ).length;


    return (

        <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-10">

            <div className="text-center space-y-4">

                <h1 className="text-3xl sm:text-4xl font-extrabold">
                    Cybermobbing-Check
                </h1>

                <p className="text-slate-600">
                    Beantworte 7 kurze Fragen.
                </p>

            </div>


            {questions.map((question, index) => (

                <div
                    key={index}
                    className="bg-white rounded-2xl p-6 shadow-md border border-slate-200 space-y-4"
                >

                    <span className="text-xs font-bold text-teal-600 uppercase">
                        Frage {index + 1} von 7
                    </span>

                    <h3 className="text-lg font-bold">
                        {question}
                    </h3>


                    <div className="flex gap-4">

                        <button
                            onClick={() =>
                                setAnswers({
                                    ...answers,
                                    [index]: "yes"
                                })
                            }
                            className={`flex-1 py-3 rounded-xl font-semibold border ${
                                answers[index] === "yes"
                                    ? "bg-red-500 text-white border-red-500"
                                    : "border-slate-200"
                            }`}
                        >
                            Ja
                        </button>


                        <button
                            onClick={() =>
                                setAnswers({
                                    ...answers,
                                    [index]: "no"
                                })
                            }
                            className={`flex-1 py-3 rounded-xl font-semibold border ${
                                answers[index] === "no"
                                    ? "bg-slate-900 text-white border-slate-900"
                                    : "border-slate-200"
                            }`}
                        >
                            Nein
                        </button>

                    </div>

                </div>

            ))}


            {completed && (

                <div className="bg-slate-900 text-white p-8 rounded-3xl shadow-xl">

                    <h3 className="text-2xl font-bold text-teal-400 mb-3">
                        Ergebnis
                    </h3>

                    <p className="text-slate-200">

                        {yesCount >= 4
                            ? "Mehrere Punkte sprechen dafür, dass du dir Unterstützung holen solltest."
                            : "Auch wenn nicht alle Punkte zutreffen, kannst du mit einer Vertrauensperson darüber sprechen."
                        }

                    </p>

                </div>

            )}

        </div>
    );
}

/* =========================
   CHALLENGE
========================= */

function ChallengeSection() {

    const [completedDays, setCompletedDays] = useState(() => {

        try {

            const saved =
                localStorage.getItem("respekt_challenge");

            return saved
                ? JSON.parse(saved)
                : {};

        } catch {

            return {};

        }

    });


    const challengeDays = [

        {
            day: 1,
            text: "Sag jemandem ehrlich Danke."
        },

        {
            day: 2,
            text: "Schließe niemanden absichtlich aus."
        },

        {
            day: 3,
            text: "Schreibe einen positiven Kommentar."
        },

        {
            day: 4,
            text: "Unterstütze jemanden, der alleine ist."
        },

        {
            day: 5,
            text: "Greife ein, wenn jemand unfair behandelt wird."
        },

        {
            day: 6,
            text: "Denke nach, bevor du etwas weiterleitest."
        },

        {
            day: 7,
            text: "Tu heute etwas Nettes für jemanden."
        }

    ];


    const toggleDay = (day) => {

        const updated = {

            ...completedDays,

            [day]: !completedDays[day]

        };


        setCompletedDays(updated);


        localStorage.setItem(
            "respekt_challenge",
            JSON.stringify(updated)
        );

    };


    return (

        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-10">

            <div className="text-center space-y-4">

                <h1 className="text-3xl sm:text-4xl font-extrabold">
                    Kleine Respekt-Challenge
                </h1>

                <p className="text-slate-600">
                    7 Tage – 7 Aktionen für mehr Respekt.
                </p>

            </div>


            <div className="space-y-4">

                {challengeDays.map(item => {

                    const done =
                        !!completedDays[item.day];


                    return (

                        <button
                            key={item.day}
                            onClick={() => toggleDay(item.day)}
                            className={`w-full p-6 rounded-2xl border flex items-center text-left transition-all ${
                                done
                                    ? "bg-teal-50 border-teal-300"
                                    : "bg-white border-slate-200"
                            }`}
                        >

                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center font-bold mr-4 ${
                                done
                                    ? "bg-teal-500 text-slate-950"
                                    : "bg-slate-100"
                            }`}>
                                {item.day}
                            </div>


                            <span className={`font-semibold ${
                                done
                                    ? "line-through text-slate-500"
                                    : "text-slate-900"
                            }`}>
                                {item.text}
                            </span>

                        </button>

                    );

                })}

            </div>

        </div>
    );
}
